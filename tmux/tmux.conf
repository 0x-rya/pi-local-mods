# ~/.config/tmux/tmux.conf
# Reload with: prefix + r        Cheatsheet: prefix + ?

# ────────────────────────────────────────────────────────────────────────────
# core
# ────────────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 100000
set -g set-clipboard on
set -g renumber-windows on

# pass through extended key sequences (CSI-u) so Shift+Enter, Ctrl+Enter,
# etc. reach inner apps like Claude Code
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'
# Kitty keyboard protocol passthrough — Ghostty speaks it natively; this makes
# tmux forward real key events (Ctrl+?, Ctrl+Shift+arrows, etc.) to inner apps
# instead of collapsed legacy bytes (e.g. 0x1f). Reload with prefix + r.
set -as terminal-features 'xterm-ghostty:kitty'
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs

# ────────────────────────────────────────────────────────────────────────────
# prefix: Ctrl-a (Ctrl-a Ctrl-a sends a literal Ctrl-a to the shell)
# ────────────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ────────────────────────────────────────────────────────────────────────────
# splits & windows — open in current path
# ────────────────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# fast last-window / last-pane
bind Tab last-window
bind \; last-pane

# ────────────────────────────────────────────────────────────────────────────
# pane navigation: hjkl with prefix, Alt-hjkl without prefix
# ────────────────────────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane resize: prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# even out a layout
bind = select-layout tiled

# ────────────────────────────────────────────────────────────────────────────
# window navigation: Shift-arrow (no prefix), Alt-1..9 to jump
# ────────────────────────────────────────────────────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ────────────────────────────────────────────────────────────────────────────
# copy mode (vi) + macOS clipboard
# ────────────────────────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi V     send-keys -X select-line
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# paste
bind p paste-buffer
bind P choose-buffer

# ────────────────────────────────────────────────────────────────────────────
# sessions / workspaces / windows
# ────────────────────────────────────────────────────────────────────────────
bind s choose-tree -Zs
bind w choose-tree -Zw
unbind N
unbind S
bind n run-shell -C \
  "display-popup -E -w 60% -h 40% \"~/.config/tmux/scripts/workspace-manager.sh new '#{client_name}' '#{pane_id}'\""
bind m run-shell -C \
  "display-popup -E -w 60% -h 70% \"~/.config/tmux/scripts/workspace-manager.sh send '#{client_name}' '#{session_id}' '#{window_id}'\""
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind Q run-shell -C \
  "display-popup -E -w 60% -h 70% \"~/.config/tmux/scripts/workspace-manager.sh delete '#{client_name}' '#{session_id}'\""

# ────────────────────────────────────────────────────────────────────────────
# misc QoL
# ────────────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind ? run-shell "~/.config/tmux/scripts/cheatsheet.sh"
bind z resize-pane -Z
bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"

# ────────────────────────────────────────────────────────────────────────────
# side panel (bonsai + git log; see scripts/)
# ────────────────────────────────────────────────────────────────────────────
bind g   run-shell "~/.config/tmux/scripts/toggle-side-panel.sh"
bind G   display-popup -E -w 70% -h 30% "~/.config/tmux/scripts/add-repo.sh"
bind R   run-shell "~/.config/tmux/scripts/reset-side-panel.sh"
bind -n M-g run-shell "~/.config/tmux/scripts/toggle-side-panel.sh"

# ────────────────────────────────────────────────────────────────────────────
# look & feel
# ────────────────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#cdd6f4,bg=default"

set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]│ "

set -g status-right-length 100
set -g status-right "#[fg=#a6e3a1]#(~/.config/tmux/scripts/status-indicator.sh #{window_id})#[fg=#585b70] │ #[fg=#f9e2af]%a %d %b #[fg=#fab387]%H:%M "

set -g window-status-separator " "
set -g window-status-format         "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

set -g pane-border-style          "fg=#45475a"
set -g pane-active-border-style   "fg=#89b4fa"
set -g message-style              "fg=#1e1e2e,bg=#f9e2af,bold"
set -g mode-style                 "fg=#1e1e2e,bg=#f9e2af"

# ────────────────────────────────────────────────────────────────────────────
# plugins (TPM)  —  prefix + I to install, prefix + U to update
# ────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
# auto-restore disabled — restore manually with prefix + Ctrl-r (save: prefix + Ctrl-s)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

run '~/.config/tmux/plugins/tpm/tpm'
