name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, offline: patches apply to the frozen fixtures and produce valid JS.
  # This is the required gate — it validates patch logic + JS syntax.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Pi patch and tmux setup tests
        run: python3 -m unittest scripts.test_apply scripts.test_tmux -v

  # Install the LATEST published Pi and confirm the patches still fit it.
  # Required: an upstream Pi release that breaks a patch fails the build and
  # must be fixed (adapt apply.py, then refresh fixtures) before merging.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install latest Pi
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Drift smoke test vs latest Pi
        run: |
          export PI_CODING_AGENT_DIR="$(npm root -g)/@earendil-works/pi-coding-agent"
          echo "Testing patches against latest Pi at $PI_CODING_AGENT_DIR"
          python3 scripts/smoke.py
